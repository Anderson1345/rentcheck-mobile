<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Reportar pago</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1C444B}a:hover{color:#0A1A1F}
</style>
</helmet>
<div style="width: 390px; height: 980px; box-sizing: border-box; background: #F3F1EC; font-family: Manrope, sans-serif; color: #0E1A1D; display: flex; flex-direction: column; position: relative">
  <div style="display: flex; align-items: center; gap: 8px; padding: 20px 16px 8px">
    <button type="button" aria-label="Volver" style="width: 44px; height: 44px; border: 0; border-radius: 14px; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0A1A1F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <h1 style="margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -0.3px">Reportar pago</h1>
  </div>

  <div style="padding: 8px 24px 120px; display: flex; flex-direction: column; gap: 24px">
    <div style="background: #0A1A1F; border-radius: 20px; padding: 18px 18px 16px; color: #FFFFFF; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; justify-content: space-between; align-items: flex-start">
        <div>
          <div style="font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.65)">Período</div>
          <div style="font-size: 18px; font-weight: 800; margin-top: 2px">Octubre de 2026</div>
        </div>
        <button type="button" style="height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.22); background: transparent; color: #FFFFFF; font-family: Manrope, sans-serif; font-size: 13px; font-weight: 700">Cambiar</button>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
        <div><div style="font-size: 13px; color: rgba(255,255,255,0.65)">Canon</div><div style="font-size: 16px; font-weight: 800; font-variant-numeric: tabular-nums">$ 800.000</div></div>
        <div><div style="font-size: 13px; color: rgba(255,255,255,0.65)">Fecha límite</div><div style="font-size: 16px; font-weight: 800">07/10/2026</div></div>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; background: rgba(197,240,106,0.12); border-radius: 12px; padding: 10px 12px">
        <div>
          <div style="font-size: 12px; font-weight: 600; color: #C5F06A">Referencia para tu transferencia</div>
          <div style="font-size: 16px; font-weight: 800; letter-spacing: 1px">RC-7F3K-1026</div>
        </div>
        <button type="button" aria-label="Copiar referencia" style="width: 40px; height: 40px; border: 0; border-radius: 12px; background: #C5F06A; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0A1A1F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5h10"/></svg></button>
      </div>
    </div>

    <div style="display: flex; gap: 10px; align-items: flex-start; background: rgba(224,162,58,0.12); border-radius: 14px; padding: 12px 14px; font-size: 14px; line-height: 1.4; color: #97600B">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#97600B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.01"/></svg>
      Ya enviaste un comprobante para este mes. Si envías otro, reemplaza al anterior.
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="monto" style="font-size: 14px; font-weight: 700; color: #465255">Monto pagado</label>
      <div style="display: flex; align-items: center; height: 56px; box-sizing: border-box; border-radius: 14px; border: 2px solid #1C444B; background: #FFFFFF; padding: 0 16px; gap: 8px; box-shadow: 0 0 0 4px rgba(197,240,106,0.5)">
        <span style="font-size: 20px; font-weight: 700; color: #5E686A">$</span>
        <input id="monto" type="text" value="800.000" style="flex-grow: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-family: Manrope, sans-serif; font-size: 20px; font-weight: 800; color: #0E1A1D; font-variant-numeric: tabular-nums">
      </div>
      <div style="font-size: 14px; color: #5E686A">Saldo del período: $ 800.000</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="fecha" style="font-size: 14px; font-weight: 700; color: #465255">Fecha en que pagaste</label>
      <div style="display: flex; align-items: center; height: 56px; box-sizing: border-box; border-radius: 14px; border: 1px solid rgba(10,26,31,0.14); background: #FFFFFF; padding: 0 16px; gap: 10px">
        <input id="fecha" type="text" value="1 de octubre de 2026" style="flex-grow: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-family: Manrope, sans-serif; font-size: 16px; color: #0E1A1D">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#465255" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="font-size: 14px; font-weight: 700; color: #465255">Comprobante</div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
        <button type="button" style="height: 92px; border-radius: 16px; border: 1px solid rgba(10,26,31,0.12); background: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; font-family: Manrope, sans-serif; font-size: 14px; font-weight: 700; color: #0E1A1D">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1C444B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><circle cx="12" cy="13" r="3.5"/><path d="M8 7l2-3h4l2 3"/></svg>Cámara</button>
        <button type="button" style="height: 92px; border-radius: 16px; border: 1px solid rgba(10,26,31,0.12); background: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; font-family: Manrope, sans-serif; font-size: 14px; font-weight: 700; color: #0E1A1D">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1C444B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 8"/></svg>Galería</button>
        <button type="button" style="height: 92px; border-radius: 16px; border: 1px solid rgba(10,26,31,0.12); background: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; font-family: Manrope, sans-serif; font-size: 14px; font-weight: 700; color: #0E1A1D">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1C444B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4M10 13h5M10 17h5"/></svg>PDF</button>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; background: #FFFFFF; border-radius: 16px; padding: 10px; border: 1px solid rgba(10,26,31,0.08)">
        <div style="width: 56px; height: 56px; border-radius: 12px; background: #DEDBD4; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #5E686A">Foto</div>
        <div style="flex-grow: 1">
          <div style="font-size: 15px; font-weight: 700">comprobante.jpg</div>
          <div style="font-size: 13px; color: #5E686A">1,2 MB · toca para ampliar</div>
        </div>
        <button type="button" style="height: 36px; padding: 0 12px; border: 0; background: transparent; font-family: Manrope, sans-serif; font-size: 14px; font-weight: 700; color: #9E1F25">Quitar</button>
      </div>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; padding: 14px 24px 22px; box-shadow: 0 -1px 0 rgba(10,26,31,0.05), 0 -18px 36px -18px rgba(10,26,31,0.32)">
    <button type="button" style="width: 100%; height: 54px; border: 0; border-radius: 16px; background: #0A1A1F; color: #FFFFFF; font-family: Manrope, sans-serif; font-size: 16px; font-weight: 700">Enviar comprobante</button>
  </div>
</div>
</x-dc>

  renderVals() { return {}; }

</body>
</html>
